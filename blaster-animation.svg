<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes gun-aim {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-16deg); }
      50% { transform: rotate(14deg); }
      75% { transform: rotate(-8deg); }
    }
    @keyframes laser-shot {
      0% { transform: translate(410px, 220px) scale(0); opacity: 0; }
      10% { transform: translate(410px, 220px) scale(1); opacity: 1; }
      35% { transform: translate(260px, 60px) scale(1.2); opacity: 1; }
      36% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes missile-flight {
      0%, 40% { transform: translate(410px, 230px) scale(0); opacity: 0; }
      45% { transform: translate(410px, 230px) scale(1); opacity: 1; }
      75% { transform: translate(580px, 75px) scale(1.3); opacity: 1; }
      76% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes target-lock {
      0%, 25% { opacity: 0; transform: scale(1.8); }
      30%, 75% { opacity: 1; transform: scale(1); }
      78%, 100% { opacity: 0; transform: scale(0.6); }
    }
    @keyframes explosion-pop {
      0%, 74% { opacity: 0; transform: translate(580px, 75px) scale(0); }
      76% { opacity: 1; transform: translate(580px, 75px) scale(1.6); }
      88% { opacity: 0.8; transform: translate(580px, 75px) scale(2.2); }
      96%, 100% { opacity: 0; transform: translate(580px, 75px) scale(2.6); }
    }
    @keyframes hit-tile-flash {
      0%, 75% { fill: #1e293b; }
      76%, 100% { fill: #22c55e; filter: drop-shadow(0 0 6px #4ade80); }
    }
    @keyframes float-text {
      0%, 75% { opacity: 0; transform: translateY(0); }
      80% { opacity: 1; transform: translateY(-8px); }
      95%, 100% { opacity: 0; transform: translateY(-22px); }
    }

    .gun-recoil { transform-origin: 410px 245px; animation: gun-aim 6s infinite ease-in-out; }
    .laser-beam { animation: laser-shot 6s infinite ease-out; }
    .tactical-missile { animation: missile-flight 6s infinite cubic-bezier(0.25, 1, 0.5, 1); }
    .target-marker { transform-origin: 580px 75px; animation: target-lock 6s infinite ease-out; }
    .nuke-burst { transform-origin: 580px 75px; animation: explosion-pop 6s infinite ease-out; }
    .target-tile { animation: hit-tile-flash 6s infinite; }
    .badge-pop { transform-origin: 580px 75px; animation: float-text 6s infinite ease-out; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; }
  </style>

  <!-- Container Frame -->
  <rect width="820" height="280" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Title HUD -->
  <g transform="translate(30, 28)">
    <circle cx="6" cy="6" r="4" fill="#10b981" />
    <text x="18" y="10" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1.5">CONTRIBUTION BLASTER // TACTICAL NUKE STRIKE</text>
    <text x="640" y="10" fill="#94a3b8" font-family="monospace" font-size="11">STREAK: 100% 🔥</text>
  </g>

